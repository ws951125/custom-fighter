name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Godot + Backend + Web + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project headlessly
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:" /tmp/godot-import.log; then
            echo "::error::Godot import emitted a script/fatal diagnostic."
            exit 1
          fi

      - name: Boot main scene headlessly
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-boot.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:" /tmp/godot-boot.log; then
            echo "::error::Godot boot emitted a script/fatal diagnostic."
            exit 1
          fi

      - name: Run Godot domain and AI contract tests
        run: |
          godot --headless --path . --script res://tests/test_runner.gd
          godot --headless --path . --script res://tests/skill_timeline_test_runner.gd
          godot --headless --path . --script res://tests/character_test_runner.gd
          godot --headless --path . --script res://tests/character_registry_test_runner.gd
          godot --headless --path . --script res://tests/character_animation_test_runner.gd
          godot --headless --path . --script res://tests/creator_character_draft_test_runner.gd
          godot --headless --path . --script res://tests/creator_skill_draft_test_runner.gd
          godot --headless --path . --script res://tests/creator_preview_session_test_runner.gd
          godot --headless --path . --script res://tests/creator_vfx_draft_test_runner.gd
          godot --headless --path . --script res://tests/ai_vfx_provider_test_runner.gd
          godot --headless --path . --script res://tests/ai_vfx_remote_config_test_runner.gd
          godot --headless --path . --script res://tests/ai_skill_proposal_test_runner.gd
          godot --headless --path . --script res://tests/ai_vfx_reference_request_test_runner.gd
          godot --headless --path . --script res://tests/character_package_test_runner.gd
          godot --headless --path . --script res://tests/self_contained_character_package_test_runner.gd
          godot --headless --path . --script res://tests/formation_test_runner.gd
          godot --headless --path . --script res://tests/buff_test_runner.gd
          godot --headless --path . --script res://tests/melee_test_runner.gd

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run trusted-backend tests
        run: |
          npm run test:backend
          node tests/reference_image_backend_test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Export Web build
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:" /tmp/godot-export.log; then
            echo "::error::Godot export emitted a script/fatal diagnostic."
            exit 1
          fi
          test -f build/web/index.html

      - name: Enforce Web build size budget
        run: python3 tools/check_web_size.py build/web

      - name: Smoke-test exported Web game in Chromium
        env:
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          python3 -m http.server 8000 --directory build/web >/tmp/custom-fighter-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/index.html; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/custom-fighter-http.log; exit 1; fi
          npm run smoke:all

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  windows-native:
    name: Windows Native Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Verify Godot
        run: godot --version
      - name: Import project headlessly
        run: godot --headless --path . --import
      - name: Cross-export Windows release build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/CustomFighter.exe
          test -f build/windows/CustomFighter.exe

  windows-edge:
    name: Windows + Microsoft Edge
    needs: validate-web
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download validated Web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium fallback
        run: npx playwright install chromium
      - name: Smoke-test Web build in Microsoft Edge
        shell: pwsh
        env:
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8000','--directory','build/web' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/index.html | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Web server did not become ready' }
            npm run smoke:edge
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  deploy-pages:
    name: Deploy Web Demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-web, windows-edge]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  production-ai-readiness:
    name: Verify Production AI Backend Readiness
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-web, windows-edge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify Render health, provider schema and deployed revision
        env:
          CUSTOM_FIGHTER_AI_VFX_ENDPOINT: https://custom-fighter-ai-vfx.onrender.com
          CUSTOM_FIGHTER_EXPECTED_REVISION: ${{ github.sha }}
        run: node tests/production_ai_readiness.mjs

  production-web:
    name: Verify Public Web Demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public Pages build
        env:
          CUSTOM_FIGHTER_WEB_URL: https://ws951125.github.io/custom-fighter/
        run: npm run smoke:production

  production-edge:
    name: Windows Edge Production Full Smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [production-web, production-ai-readiness]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium fallback
        run: npx playwright install chromium
      - name: Smoke-test production in Microsoft Edge
        shell: pwsh
        env:
          CUSTOM_FIGHTER_WEB_URL: https://ws951125.github.io/custom-fighter/
        run: npm run smoke:edge
