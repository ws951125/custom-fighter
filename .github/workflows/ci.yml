name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Godot + Web + Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --import

      - name: Boot main scene headlessly
        run: godot --headless --path . --quit-after 2

      - name: Run domain tests
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install browser-test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke-test exported Web game in Chromium
        run: |
          python3 -m http.server 8000 --directory build/web >/tmp/custom-fighter-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/index.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/custom-fighter-http.log
            exit 1
          fi

          npm run smoke:web

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-fighter-web
          path: build/web
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  windows-edge-local:
    name: Windows + Microsoft Edge
    needs: validate-web
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download validated Web build
        uses: actions/download-artifact@v4
        with:
          name: custom-fighter-web
          path: build/web

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke-test Web build in installed Microsoft Edge
        shell: pwsh
        env:
          BROWSER_CHANNEL: msedge
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','8000','--directory','build/web' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8000/index.html' -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw 'Local Web server did not become ready.'
            }
            npm run smoke:web
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

  deploy-pages:
    name: Deploy Web Demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-web, windows-edge-local]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify Public Web Demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify production URL is publicly reachable
        env:
          LIVE_URL: https://ws951125.github.io/custom-fighter/
        run: |
          echo "Checking $LIVE_URL"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/custom-fighter-live.html \
            --write-out 'HTTP %{http_code}\n' \
            "$LIVE_URL"
          test -s /tmp/custom-fighter-live.html
          echo "PUBLIC_WEB_DEMO_REACHABLE"

  windows-edge-production:
    name: Windows Edge Production Game
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run real game flow against GitHub Pages in Microsoft Edge
        env:
          BROWSER_CHANNEL: msedge
          CUSTOM_FIGHTER_WEB_URL: https://ws951125.github.io/custom-fighter/
        run: npm run smoke:web
