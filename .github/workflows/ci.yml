name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Godot + Web + Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project headlessly
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:" /tmp/godot-import.log; then
            echo "::error::Godot import emitted a script/fatal diagnostic."
            exit 1
          fi

      - name: Boot main scene headlessly
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-boot.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:" /tmp/godot-boot.log; then
            echo "::error::Godot boot emitted a script/fatal diagnostic."
            exit 1
          fi

      - name: Run domain tests
        run: |
          godot --headless --path . --script res://tests/test_runner.gd
          godot --headless --path . --script res://tests/character_test_runner.gd
          godot --headless --path . --script res://tests/character_registry_test_runner.gd
          godot --headless --path . --script res://tests/character_animation_test_runner.gd
          godot --headless --path . --script res://tests/creator_character_draft_test_runner.gd
          godot --headless --path . --script res://tests/creator_skill_draft_test_runner.gd
          godot --headless --path . --script res://tests/creator_preview_session_test_runner.gd
          godot --headless --path . --script res://tests/creator_vfx_draft_test_runner.gd
          godot --headless --path . --script res://tests/ai_vfx_provider_test_runner.gd
          godot --headless --path . --script res://tests/character_package_test_runner.gd
          godot --headless --path . --script res://tests/self_contained_character_package_test_runner.gd
          godot --headless --path . --script res://tests/formation_test_runner.gd
          godot --headless --path . --script res://tests/buff_test_runner.gd
          godot --headless --path . --script res://tests/melee_test_runner.gd

      - name: Export Web build
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:" /tmp/godot-export.log; then
            echo "::error::Godot export emitted a script/fatal diagnostic."
            exit 1
          fi
          test -f build/web/index.html

      - name: Enforce Web build size budget
        run: python3 tools/check_web_size.py build/web

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install browser-test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke-test exported Web game in Chromium
        run: |
          python3 -m http.server 8000 --directory build/web >/tmp/custom-fighter-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/index.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/custom-fighter-http.log
            exit 1
          fi

          npm run smoke:all
          node tests/creator_package_vfx_web_smoke.mjs

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-fighter-web
          path: build/web
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  windows-native-release:
    name: Windows Native Release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        shell: pwsh
        run: godot --version

      - name: Export Windows release build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build/windows' | Out-Null
          $logPath = Join-Path $env:RUNNER_TEMP 'custom-fighter-windows-export.log'
          $exportOutput = & godot --headless --path . --export-release 'Windows Desktop' 'build/windows/CustomFighter.exe' 2>&1
          $exportExitCode = $LASTEXITCODE
          $exportOutput | Tee-Object -FilePath $logPath
          if ($exportExitCode -ne 0) {
            throw "Godot Windows export exited with code $exportExitCode"
          }
          $logText = Get-Content -Raw -Path $logPath
          if ($logText -match 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:') {
            throw 'Godot Windows export emitted a script/fatal diagnostic.'
          }
          if (-not (Test-Path 'build/windows/CustomFighter.exe')) {
            throw 'Windows release executable was not created.'
          }
          if (-not (Test-Path 'build/windows/CustomFighter.pck')) {
            throw 'Windows release PCK was not created.'
          }
          Get-ChildItem -Path 'build/windows' | Format-Table Name, Length

      - name: Smoke-test Windows native executable
        shell: pwsh
        run: |
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'custom-fighter-native.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'custom-fighter-native.stderr.log'
          $exePath = (Resolve-Path 'build/windows/CustomFighter.exe').Path
          $process = Start-Process -FilePath $exePath -ArgumentList '--headless','--quit-after','3' -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Windows native smoke timed out before bounded headless exit.'
          }
          $stdoutText = if (Test-Path $stdoutPath) { Get-Content -Raw -Path $stdoutPath } else { '' }
          $stderrText = if (Test-Path $stderrPath) { Get-Content -Raw -Path $stderrPath } else { '' }
          Write-Host $stdoutText
          Write-Host $stderrText
          if ($process.ExitCode -ne 0) {
            throw "Windows native executable exited with code $($process.ExitCode)"
          }
          $combined = "$stdoutText`n$stderrText"
          if ($combined -match 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|FATAL:') {
            throw 'Windows native smoke emitted a script/fatal diagnostic.'
          }
          Write-Host 'WINDOWS_NATIVE_SMOKE_PASSED'

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-fighter-windows-x86_64
          path: build/windows
          if-no-files-found: error

  windows-edge-local:
    name: Windows + Microsoft Edge
    needs: validate-web
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download validated Web build
        uses: actions/download-artifact@v4
        with:
          name: custom-fighter-web
          path: build/web

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke-test Web build in installed Microsoft Edge
        shell: pwsh
        env:
          BROWSER_CHANNEL: msedge
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','8000','--directory','build/web' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8000/index.html' -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw 'Local Web server did not become ready.'
            }
            npm run smoke:all
            node tests/creator_package_vfx_web_smoke.mjs
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

  deploy-pages:
    name: Deploy Web Demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-web, windows-native-release, windows-edge-local]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify Public Web Demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify production URL is publicly reachable
        env:
          LIVE_URL: https://ws951125.github.io/custom-fighter/
        run: |
          echo "Checking $LIVE_URL"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/custom-fighter-live.html \
            --write-out 'HTTP %{http_code}\n' \
            "$LIVE_URL"
          test -s /tmp/custom-fighter-live.html
          echo "PUBLIC_WEB_DEMO_REACHABLE"

  windows-edge-production:
    name: Windows Edge Production Game
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run real game flow against GitHub Pages in Microsoft Edge
        env:
          BROWSER_CHANNEL: msedge
          CUSTOM_FIGHTER_WEB_URL: https://ws951125.github.io/custom-fighter/
        run: |
          npm run smoke:all
          node tests/creator_package_vfx_web_smoke.mjs
