name: Production AI Provider E2E

on:
  workflow_dispatch:
    inputs:
      confirm_billable_provider_calls:
        description: 'I understand this workflow makes real billable AI provider calls.'
        required: true
        type: boolean
        default: false
      expected_provider:
        description: 'Optional expected selected provider (openai or gemini). Leave empty to accept either configured provider.'
        required: false
        type: choice
        options:
          - ''
          - openai
          - gemini
        default: ''

permissions:
  contents: read

jobs:
  production-ai-provider-e2e:
    name: Real Production AI Provider Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit billable-call confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm_billable_provider_calls }}" != "true" ]; then
            echo "Refusing to call the production AI provider without explicit billable-call confirmation."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install production test dependency
        run: npm install --no-audit --no-fund

      - name: Run real text + reference-image production acceptance
        env:
          CUSTOM_FIGHTER_AI_BACKEND_URL: https://custom-fighter-ai-vfx.onrender.com
          EXPECTED_AI_PROVIDER: ${{ inputs.expected_provider }}
        run: node tests/production_ai_provider_e2e.mjs
