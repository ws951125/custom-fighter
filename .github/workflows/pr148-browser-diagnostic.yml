name: PR148 Browser Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr148-browser-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-browser-tail:
    name: PR148 browser-tail diagnostic
    if: github.event.pull_request.number == 148
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Node dependencies
        id: deps
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        id: browser
        run: npx playwright install --with-deps chromium

      - name: Export Web build
        id: export
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Diagnostic smoke - creator preview family
        if: always() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' && steps.export.outcome == 'success'
        env:
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          python3 -m http.server 8000 --directory build/web >/tmp/pr148-preview-family-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/index.html; then break; fi
            sleep 1
          done
          npm run smoke:creator-preview-family

      - name: Diagnostic smoke - creator package
        if: always() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' && steps.export.outcome == 'success'
        env:
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          python3 -m http.server 8000 --directory build/web >/tmp/pr148-package-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/index.html; then break; fi
            sleep 1
          done
          npm run smoke:creator-package

      - name: Diagnostic smoke - creator package VFX
        if: always() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' && steps.export.outcome == 'success'
        env:
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          python3 -m http.server 8000 --directory build/web >/tmp/pr148-package-vfx-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/index.html; then break; fi
            sleep 1
          done
          npm run smoke:creator-package-vfx

      - name: Diagnostic smoke - mobile
        if: always() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' && steps.export.outcome == 'success'
        env:
          CUSTOM_FIGHTER_WEB_URL: http://127.0.0.1:8000
        run: |
          python3 -m http.server 8000 --directory build/web >/tmp/pr148-mobile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/index.html; then break; fi
            sleep 1
          done
          npm run smoke:mobile
